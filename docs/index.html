<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline Referee</title>
<meta name="description" content="Catch what changed in the contract they sent back. Built on Clocked Verify, Compare and Rerank.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Redline Referee">
<meta property="og:title" content="Redline Referee">
<meta property="og:description" content="Catch what changed in the contract they sent back. Built on Clocked Verify, Compare and Rerank.">
<meta property="og:url" content="https://ian18858863.github.io/redline-referee/">
<meta property="og:image" content="https://ian18858863.github.io/redline-referee/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Redline Referee: two versions of an agreement side by side, the changed terms marked, and the verdict Do not sign.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Redline Referee">
<meta name="twitter:description" content="Catch what changed in the contract they sent back. Built on Clocked Verify, Compare and Rerank.">
<meta name="twitter:image" content="https://ian18858863.github.io/redline-referee/og.png">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M7 16h18' stroke='%23e0492f' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-status="loading">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">Redline Referee</span>
      <span class="brand-tag">Catch what changed in the contract they sent back.</span>
    </div>
    <nav class="toplinks" aria-label="About this demo">
      <a href="demo.mp4" target="_blank" rel="noopener">Video</a>
      <a href="https://github.com/Ian18858863/redline-referee" target="_blank" rel="noopener">GitHub</a>
      <button type="button" id="how-btn">How it works</button>
    </nav>
    <div class="topbar-right">
      <div class="switcher" id="switcher">
        <button type="button" class="switcher-btn" id="switcher-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="dot" id="switcher-dot"></span>
          <span class="switcher-label" id="switcher-label">Loading</span>
          <span class="ico" data-ico="chevron"></span>
        </button>
        <div class="switcher-menu" id="switcher-menu" role="listbox" aria-label="Review" hidden></div>
      </div>
      <span class="mode-badge" id="mode-badge" hidden></span>
      <button type="button" class="clocked-pill" id="clocked-pill" hidden></button>
      <span class="cta" id="cta-static" hidden>
        <a class="btn btn--primary" id="watch-btn" href="demo.mp4#t=161" target="_blank" rel="noopener"><span class="ico" data-ico="play"></span>Watch a live review</a>
        <a class="cta-link" id="run-link" href="https://github.com/Ian18858863/redline-referee#run-it" target="_blank" rel="noopener">Run it on your own PDFs</a>
      </span>
      <span class="upload-wrap" id="upload-wrap" hidden>
        <button type="button" class="btn" id="upload-btn">
          <span class="ico" data-ico="upload"></span>Review your own PDFs
        </button>
      </span>
    </div>
  </header>

  <section class="intro" id="intro" aria-label="Start here" hidden></section>

  <section class="verdict" id="verdict" aria-live="polite"></section>
  <section class="errors" id="errors" hidden></section>
  <section class="warns" id="warnings" aria-label="Notes from the review" hidden></section>

  <main class="main" id="main">
    <aside class="left" aria-label="Findings">
      <div class="tabs" role="tablist" id="left-tabs">
        <button type="button" role="tab" class="tab" data-tab="changes" aria-selected="true">Changes<span class="count" id="count-changes"></span></button>
        <button type="button" role="tab" class="tab" data-tab="note" aria-selected="false">Cover note<span class="count" id="count-note"></span></button>
        <button type="button" role="tab" class="tab" data-tab="terms" aria-selected="false">Key terms<span class="count" id="count-terms"></span></button>
      </div>
      <div class="left-body" id="left-body" role="tabpanel"></div>
    </aside>

    <section class="center" aria-label="Documents">
      <div class="doc-toolbar">
        <div class="doc-toolbar-left">
          <div class="seg" id="view-seg" role="group" aria-label="Document view">
            <button type="button" data-view="both" aria-pressed="true">Side by side</button>
            <button type="button" data-view="v1" aria-pressed="false">We sent</button>
            <button type="button" data-view="v2" aria-pressed="false">They returned</button>
          </div>
          <div class="switcher layer-switch" id="layer-switch" hidden></div>
        </div>
        <div class="zoom" role="group" aria-label="Zoom">
          <button type="button" class="icon-btn" id="zoom-out" aria-label="Zoom out"><span class="ico" data-ico="minus"></span></button>
          <span class="zoom-val" id="zoom-val">100%</span>
          <button type="button" class="icon-btn" id="zoom-in" aria-label="Zoom in"><span class="ico" data-ico="plus"></span></button>
          <button type="button" class="btn btn--sm" id="zoom-fit">Fit width</button>
        </div>
      </div>
      <div class="gate-card" id="gate" hidden></div>
      <div class="docs" id="docs" data-view="both"></div>
      <div class="legend" id="legend" aria-label="Legend"></div>
    </section>

    <aside class="right" id="detail" aria-label="Selected change"></aside>
  </main>

  <footer class="drawer" id="drawer" data-open="false"></footer>
</div>

<dialog class="modal" id="upload-dialog" aria-labelledby="upload-title">
  <form id="upload-form" method="dialog" novalidate>
    <header class="modal-head">
      <h2 id="upload-title">Review your own PDFs</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close"><span class="ico" data-ico="x"></span></button>
    </header>
    <div class="modal-body">
      <label class="field">
        <span class="field-label">The version we sent <em>v1, PDF</em></span>
        <input type="file" name="v1" accept="application/pdf,.pdf" required>
      </label>
      <label class="field">
        <span class="field-label">The copy they returned <em>v2, PDF</em></span>
        <input type="file" name="v2" accept="application/pdf,.pdf" required>
      </label>
      <label class="field">
        <span class="field-label">Their cover note <em>optional</em></span>
        <textarea name="note" rows="6" placeholder="Paste the e-mail or note that came with the returned copy."></textarea>
      </label>
      <p class="modal-note">Both PDFs need a text layer. The review calls Clocked and can take up to a minute.</p>
      <div class="form-error" id="upload-error" role="alert" hidden></div>
    </div>
    <footer class="modal-foot">
      <span class="busy" id="upload-busy" hidden><span class="spinner" aria-hidden="true"></span>Reviewing the two versions</span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn btn--primary" id="upload-submit">Run review</button>
    </footer>
  </form>
</dialog>

<dialog class="modal modal--wide" id="reply-dialog" aria-labelledby="reply-title">
  <header class="modal-head">
    <h2 id="reply-title">Summary</h2>
    <button type="button" class="icon-btn" data-close aria-label="Close"><span class="ico" data-ico="x"></span></button>
  </header>
  <div class="modal-body" id="reply-body"></div>
  <footer class="modal-foot">
    <span class="busy" id="reply-copied" role="status" hidden></span>
    <button type="button" class="btn" id="reply-undo" hidden>Undo</button>
    <button type="button" class="btn btn--primary" data-close>Done</button>
  </footer>
</dialog>

<noscript><p style="padding:24px;font-family:sans-serif">Redline Referee needs JavaScript to show a review.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
